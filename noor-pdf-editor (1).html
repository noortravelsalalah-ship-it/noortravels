<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noor PDF Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5b324'/%3E%3Cpath d='M21.5 7.5A9 9 0 1 0 21.5 24.5A7 7 0 1 1 21.5 7.5Z' fill='%230b1437'/%3E%3C/svg%3E">
<style>
:root{--navy:#0b1437;--indigo:#27358f;--gold:#f5b324;--gold2:#e8a010;--bg:#eef1f8;--line:#e3e7f1;--text:#17203f;--mut:#6a7494;--blue:#4f7cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
svg{flex:none}

/* header */
.top{height:58px;background:linear-gradient(100deg,#0b1437 0%,#18266b 60%,#27358f 100%);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;flex:none;box-shadow:0 2px 14px rgba(11,20,55,.35);z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:500;opacity:.7;font-size:13px;margin-left:3px}
.fname{opacity:.85;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26vw;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.1)}
.sp{flex:1}
.btn{border:0;border-radius:11px;padding:9px 14px;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap;transition:.15s}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.gold{background:linear-gradient(180deg,#ffc542,#f0a812);color:#1b1300;box-shadow:0 4px 14px rgba(245,179,36,.35)}
.btn.gold:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.35;cursor:default}
.icon-btn{padding:9px}

/* toolbar */
.toolbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px;overflow-x:auto;white-space:nowrap;flex:none;box-shadow:0 3px 12px rgba(15,27,61,.05);z-index:5}
.grp{display:flex;align-items:center;gap:2px;background:#f2f4fb;border-radius:15px;padding:4px;flex:none}
.tool{border:0;background:transparent;border-radius:11px;padding:5px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:#3b4468;min-width:56px;transition:.12s}
.tool svg{color:var(--c,#475569)}
.tool:hover{background:#fff}
.tool.on{background:#fff;box-shadow:inset 0 -3px 0 var(--gold),0 3px 10px rgba(15,27,61,.14);color:var(--navy)}
.tool:disabled{opacity:.35;cursor:default}
.zoomv{min-width:46px;text-align:center;font-weight:700;font-size:13px}
.pgind{font-size:12px;color:var(--mut);padding:0 10px;min-width:62px;text-align:center;font-weight:600}

/* props */
.props{background:linear-gradient(180deg,#fbfcff,#f5f7fd);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:6px 16px;min-height:46px;overflow-x:auto;white-space:nowrap;flex:none;font-size:13px}
.hint{color:var(--mut)}
.ctl{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600}
.ctl input[type=color]{width:32px;height:28px;border:1px solid var(--line);border-radius:8px;padding:1px;background:#fff;cursor:pointer}
.ctl input[type=number],.ctl select{height:28px;border:1px solid var(--line);border-radius:8px;padding:0 6px;background:#fff;color:var(--text);width:64px}
.ctl select{width:auto}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:4px 11px;font-size:12px;font-weight:600}
.mini:hover{background:#f3f5fb}
.mini.danger{color:#b42318;border-color:#f3c9c4}

/* layout */
main{flex:1;min-height:0;display:flex;position:relative}
#side{width:172px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:14px 8px;flex:none;text-align:center}
#viewer{flex:1;overflow:auto;padding:22px;background:radial-gradient(1200px 500px at 50% -100px,#f4f6ff,transparent),linear-gradient(180deg,#e4e8f5,#d9deee);position:relative}
.page{position:relative;background:#fff;margin:0 auto 18px;box-shadow:0 4px 22px rgba(15,27,61,.22);flex:none;border-radius:2px}
.page canvas{position:absolute;left:0;top:0;display:block}
.layer{position:absolute;inset:0;overflow:hidden}
body[data-tool=text] .layer{cursor:text}
body[data-tool=hl] .layer,body[data-tool=wo] .layer,body[data-tool=shape] .layer,body[data-tool=pen] .layer{cursor:crosshair;touch-action:none}
.an{position:absolute;touch-action:none;cursor:move}
.an.sel{outline:2px solid var(--blue);outline-offset:1px}
.an.text{white-space:pre;line-height:1.25;min-width:8px;min-height:1.25em}
.an.text.edit{cursor:text;outline:2px dashed var(--blue);background:rgba(255,255,255,.7)}
.an img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.rh{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:var(--blue);border:2px solid #fff;border-radius:50%;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
svg.pen{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.pen path{pointer-events:stroke;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hov{position:absolute;pointer-events:none;border:1.5px dashed var(--blue);background:rgba(79,124,255,.09);border-radius:3px;display:none}

/* floating text toolbar */
.ftb{position:absolute;z-index:30;display:flex;align-items:center;gap:1px;background:#fff;border:1px solid #c9d4ff;border-radius:12px;box-shadow:0 8px 26px rgba(15,27,61,.25);padding:3px;white-space:nowrap}
.fb{border:0;background:transparent;border-radius:8px;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-size:13px;color:#2a3358}
.fb:hover{background:#eef2ff}
.fb.on{background:#dfe7ff;color:#1d3fd6}
.fb.mv{cursor:grab;color:#6a7494}
.fb.dn{color:#c0392b}
.fsz{min-width:24px;text-align:center;font-size:12px;font-weight:700;color:#2a3358}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aab4d6;display:block}
.pal{position:absolute;left:0;top:calc(100% + 6px);display:flex;gap:6px;flex-wrap:wrap;width:196px;background:#fff;border:1px solid #c9d4ff;border-radius:12px;padding:10px;box-shadow:0 8px 26px rgba(15,27,61,.25)}
.pal .pc{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 1px #c3cae3;cursor:pointer}

/* thumbs */
.th{position:relative;margin-bottom:14px}
.th .box{position:relative;display:inline-block;border:2px solid transparent;border-radius:8px;padding:3px;background:#fff;box-shadow:0 2px 8px rgba(15,27,61,.2);cursor:pointer;transition:.12s}
.th .box:hover{transform:translateY(-1px)}
.th.cur .box{border-color:var(--gold);box-shadow:0 4px 14px rgba(245,179,36,.35)}
.th.over .box{border-color:var(--blue)}
.th canvas{display:block;background:#fff;border-radius:3px}
.th .num{font-size:12px;color:var(--mut);margin-top:5px;font-weight:700}
.th .chk{position:absolute;left:10px;top:7px;z-index:2;line-height:0;background:#fff;border-radius:5px;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.th .acts{display:flex;justify-content:center;gap:1px;margin-top:2px}
.th .acts button{border:0;background:transparent;border-radius:7px;padding:4px;color:var(--mut)}
.th .acts button:hover{background:#eef0f6;color:var(--text)}

/* hero / empty */
#empty{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:auto;background:radial-gradient(900px 500px at 15% 10%,#3a4fc2 0%,transparent 60%),radial-gradient(800px 500px at 90% 90%,#7b4bd8 0%,transparent 55%),linear-gradient(135deg,#0b1437,#18266b)}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;pointer-events:none}
.blob.b1{width:280px;height:280px;left:6%;bottom:8%;background:radial-gradient(circle at 30% 30%,#ffd978,#f5b324 60%,transparent 62%);opacity:.18}
.blob.b2{width:180px;height:180px;right:10%;top:10%;background:radial-gradient(circle at 30% 30%,#fff,#9db3ff 60%,transparent 62%);opacity:.15}
.hcard{position:relative;max-width:640px;width:100%;text-align:center;background:rgba(255,255,255,.96);border-radius:28px;padding:42px 32px 30px;box-shadow:0 30px 80px rgba(0,0,0,.4);transition:.2s}
body.dragging .hcard{transform:scale(1.02);box-shadow:0 0 0 4px var(--gold),0 30px 80px rgba(0,0,0,.4)}
.hcard h1{margin:16px 0 8px;font-size:30px;letter-spacing:-.4px;color:var(--navy)}
.hcard h1 span{background:linear-gradient(90deg,#e8a010,#f5b324);-webkit-background-clip:text;background-clip:text;color:transparent}
.hcard p{margin:0 auto 24px;color:var(--mut);max-width:430px}
.big{border:0;border-radius:16px;padding:15px 34px;font-size:17px;font-weight:800;background:linear-gradient(180deg,#ffc542,#f0a812);color:#1b1300;box-shadow:0 10px 26px rgba(245,179,36,.45);display:inline-flex;align-items:center;gap:10px;transition:.15s}
.big:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(245,179,36,.55)}
.lnk{display:block;margin:14px auto 0;background:none;border:0;color:var(--indigo);font-weight:600;text-decoration:underline}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}
.feat{background:#f4f6fd;border-radius:16px;padding:14px 8px;font-size:12px;font-weight:700;color:#2a3358}
.feat svg{color:var(--indigo);display:block;margin:0 auto 6px}
.fine{margin-top:18px;font-size:12px;color:var(--mut)}

/* popover for image library */
#imgPop{position:fixed;z-index:70;width:290px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(15,27,61,.3);padding:12px}
.pophd{font-weight:800;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:230px;overflow:auto;margin-bottom:10px}
.pit{position:relative;border:1px solid var(--line);border-radius:10px;height:70px;background:repeating-conic-gradient(#f1f3f9 0 25%,#fff 0 50%) 0 0/12px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pit:hover{border-color:var(--gold)}
.pit img{max-width:100%;max-height:100%;object-fit:contain}
.pit .x{position:absolute;right:2px;top:2px;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:20px;height:20px;line-height:18px;padding:0;color:#b42318;font-weight:800}
.row2{display:flex;gap:8px}
.btn2{flex:1;border:1px solid var(--line);background:#f6f8fd;border-radius:11px;padding:9px;font-weight:700;font-size:12.5px}
.btn2:hover{background:#eef1fb}
.btn2.pri{background:var(--gold);border-color:var(--gold);color:#1b1300}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(11,20,55,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:80;padding:14px}
.card{background:#fff;border-radius:20px;padding:20px;width:min(680px,100%);box-shadow:0 24px 70px rgba(0,0,0,.4)}
.card h3{margin:0 0 12px}
.seg{display:inline-flex;background:#eef0f6;border-radius:11px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:9px;font-weight:700;color:var(--mut)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#sigPad{width:100%;height:auto;aspect-ratio:640/220;border:2px dashed #b9c1dc;border-radius:14px;background:#fcfcff;touch-action:none;display:block}
#sigText{width:100%;margin-bottom:10px;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font:inherit}
.mrow{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9cfe3;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--navy)}
.card .btn{background:#eef0f6;color:var(--text)}
.card .btn.gold{background:linear-gradient(180deg,#ffc542,#f0a812);color:#1b1300}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:600;max-width:90vw}

@media(max-width:800px){
  .fname,.brand small,.btn .lbl{display:none}
  #side{position:absolute;z-index:20;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.2)}
  #side.open{transform:none}
  #viewer{padding:10px}
  .feats{grid-template-columns:repeat(2,1fr)}
  .hcard{padding:30px 18px 22px}.hcard h1{font-size:24px}
}
</style>
</head>
<body data-tool="text">

<header class="top">
  <button class="btn icon-btn" id="btnSide" title="Pages"></button>
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#f5b324"/><path d="M21.5 7.5A9 9 0 1 0 21.5 24.5A7 7 0 1 1 21.5 7.5Z" fill="#0b1437"/><circle cx="23.5" cy="10" r="1.6" fill="#0b1437"/></svg>
    <span>Noor <small>PDF Editor</small></span>
  </div>
  <div class="fname" id="fname"></div>
  <div class="sp"></div>
  <button class="btn icon-btn" id="btnUndo" title="Undo (Ctrl+Z)"></button>
  <button class="btn icon-btn" id="btnRedo" title="Redo (Ctrl+Y)"></button>
  <button class="btn" id="btnOpen"></button>
  <button class="btn gold" id="btnDl"></button>
</header>

<div class="toolbar" id="toolbar">
  <div class="grp" id="toolsA"></div>
  <div class="grp" id="toolsB"></div>
  <div class="grp">
    <button class="tool" id="zOut"></button>
    <span class="zoomv" id="zv">100%</span>
    <button class="tool" id="zIn"></button>
    <button class="tool" id="zFit"></button>
  </div>
  <div class="grp">
    <span class="pgind" id="pgind">–</span>
    <button class="tool" data-pg="rot"></button>
    <button class="tool" data-pg="del"></button>
    <button class="tool" data-pg="blank"></button>
    <button class="tool" data-pg="merge"></button>
    <button class="tool" data-pg="extract"></button>
  </div>
</div>

<div class="props" id="props"></div>

<main id="main">
  <aside id="side"><div id="thumbs"></div></aside>
  <section id="viewer"></section>
  <div id="empty">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="hcard">
      <svg width="68" height="68" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#0b1437"/><path d="M21.5 7.5A9 9 0 1 0 21.5 24.5A7 7 0 1 1 21.5 7.5Z" fill="#f5b324"/><circle cx="23.5" cy="10" r="1.6" fill="#f5b324"/></svg>
      <h1>Edit any PDF, <span>beautifully</span></h1>
      <p>Click on existing text and change it, add text, images and signatures, merge and organise pages. All inside your browser.</p>
      <button class="big" id="emOpen"></button>
      <button class="lnk" id="emBlank">or start with a blank document</button>
      <div class="feats" id="feats"></div>
      <div class="fine">Private by design: your files never leave this device. Drag &amp; drop a PDF anywhere.</div>
    </div>
  </div>
</main>

<div id="imgPop" class="hidden"></div>
<input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="mergeFile" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="imgFile" accept="image/*" hidden>

<div class="modal hidden" id="sigModal">
  <div class="card">
    <h3>Add your signature</h3>
    <div class="seg"><button data-m="draw" class="on">Draw</button><button data-m="type">Type</button></div>
    <input id="sigText" class="hidden" placeholder="Type your name">
    <canvas id="sigPad" width="640" height="220"></canvas>
    <div class="mrow">
      <span class="hint">Ink</span>
      <span class="sw on" data-ink="#111111" style="background:#111"></span>
      <span class="sw" data-ink="#1d4ed8" style="background:#1d4ed8"></span>
      <span class="sw" data-ink="#c81e1e" style="background:#c81e1e"></span>
      <button class="btn" id="sigClear">Clear</button>
      <span class="sp"></span>
      <button class="btn" id="sigCancel">Cancel</button>
      <button class="btn gold" id="sigOk">Place signature</button>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';

/* ---------- icons ---------- */
const IC={
 select:'<path d="M5 3l14 7-6 2-2 6z"/>',
 text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/>',
 sign:'<path d="M3 16c3-8 5-10 6-8s-2 8 1 7 3-5 5-4 1 3 3 2"/><path d="M3 21h18"/>',
 hl:'<path d="M14 4l6 6-8 8-4 1 1-4z"/><path d="M4 21h8"/>',
 wo:'<path d="M7 21h12M5 13l8-8 6 6-8 8H8z"/>',
 shape:'<rect x="4" y="5" width="16" height="14" rx="1.5"/>',
 pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
 redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/>',
 download:'<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>',
 open:'<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>',

 rotr:'<path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 up:'<path d="M6 15l6-6 6 6"/>',
 down:'<path d="M6 9l6 6 6-6"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 minus:'<path d="M5 12h14"/>',
 blank:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/>',
 merge:'<path d="M6 4v5a4 4 0 004 4h4a4 4 0 014 4v3"/><path d="M18 4v5M12 13V4"/><path d="M15 17l3 3 3-3"/>',
 extract:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M9 14h6M12 11v6"/>',

 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 move:'<path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>'
};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const lbl=t=>`<span class="lbl">${t}</span>`;

/* ---------- state ---------- */
const TOOLSA=[['select','Select','#475569'],['text','Edit Text','#2563eb'],['image','Images','#7c3aed'],['sign','Sign','#0d9488']];
const TOOLSB=[['wo','Whiteout','#64748b'],['hl','Highlight','#d97706'],['pen','Draw','#e11d48'],['shape','Shapes','#4f46e5']];
const FAM={sans:'Helvetica,Arial,"Noto Sans Bengali",sans-serif',serif:'"Times New Roman",Times,"Noto Serif Bengali",serif',mono:'"Courier New",monospace'};

const PAL=['#111827','#6b7280','#ffffff','#dc2626','#ea580c','#ca8a04','#16a34a','#0d9488','#2563eb','#7c3aed','#db2777','#7fb23d'];

function refreshUi(){
  const has=S.pages.length>0;
  $('#empty').classList.toggle('hidden',has);
  $('#viewer').classList.toggle('hidden',!has);
  $('#side').classList.toggle('hidden',!has);
  $('#toolbar').classList.toggle('hidden',!has);
  $('#props').classList.toggle('hidden',!has);
  $('#btnUndo').disabled=!S.undo.length;$('#btnRedo').disabled=!S.redo.length;

/* ---------- history ---------- */
const snap=()=>JSON.stringify(S.pages);
function push(){S.undo.push(snap());if(S.undo.length>60)S.undo.shift();S.redo=[];refreshUi()}
function undo(){if(!S.undo.length)return;S.redo.push(snap());S.pages=JSON.parse(S.undo.pop());S.sel=null;renderAll();renderProps()}
function redo(){if(!S.redo.length)return;S.undo.push(snap());S.pages=JSON.parse(S.redo.pop());S.sel=null;renderAll();renderProps()}
let burstT;function burst(){if(!burstT)push();clearTimeout(burstT);burstT=setTimeout(()=>burstT=null,700)}

/* ---------- loading PDFs ---------- */
async function addPdf(buf){
  const bytes=new Uint8Array(buf);
  const task=pdfjsLib.getDocument({data:bytes.slice()});
  task.onPassword=(cb,reason)=>{const pw=prompt(reason===2?'Wrong password. Try again:':'This PDF is password-protected. Enter the password:');if(pw===null){task.destroy();}else cb(pw)};
  const pdf=await task.promise;
  const di=S.docs.push({bytes,pdf,pg:{},tc:{}})-1;
  for(let n=1;n<=pdf.numPages;n++){
    const pg=await pdf.getPage(n);S.docs[di].pg[n]=pg;
    const vp=pg.getViewport({scale:1});
    S.pages.push({id:nid(),doc:di,n,rot:0,w:vp.width,h:vp.height,annots:[]});
  }
}
function reset(){S.docs=[];S.pages=[];S.assets={};S.undo=[];S.redo=[];S.sel=null;S.checked=new Set();S.runs={};S.loading={}}
async function openFiles(fs,append){
  fs=[...fs].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
  if(!fs.length)return toast('Please choose a PDF file');
  if(typeof pdfjsLib==='undefined'||typeof PDFLib==='undefined')return toast('Libraries failed to load. Check your internet connection.');
  if(!append&&S.pages.length&&S.undo.length&&!confirm('Open a new file? Unsaved changes will be lost.'))return;
  toast('Opening…',true);
  try{
    if(append)push();else{reset();S.name=fs[0].name.replace(/\.pdf$/i,'')}
    for(const f of fs)await addPdf(await f.arrayBuffer());
    refreshUi();
    if(!append){fitZoom(true);S.tool='text';document.body.dataset.tool='text';setToolUi()}
    renderAll();renderProps();hideToast();
    if(!append)toast('Tip: click any text on the page to edit it');
  }catch(err){console.error(err);toast('Could not open this PDF: '+(err.message||err));if(!S.pages.length)refreshUi()}
}
function addBlankFirst(){
  reset();S.name='untitled';
  S.pages.push({id:nid(),doc:-1,n:0,rot:0,w:595.28,h:841.89,annots:[]});
  S.tool='text';document.body.dataset.tool='text';setToolUi();
  refreshUi();fitZoom(true);renderAll();renderProps();
}

/* ---------- rendering ---------- */
function fitZoom(silent){
  const v=$('#viewer');const mw=Math.max(...S.pages.map(p=>dims(p).w),300);
  S.zoom=clamp((v.clientWidth-(innerWidth<800?20:56))/mw,.4,1.6);
  if(!silent)renderMain();
  refreshUi();
}
function setZoom(z){
  const v=$('#viewer');const f=v.scrollHeight?v.scrollTop/v.scrollHeight:0;
  S.zoom=clamp(z,.4,3.5);refreshUi();renderMain();v.scrollTop=f*v.scrollHeight;
}
function renderAll(){refreshUi();renderMain();renderThumbs()}
function renderMain(){
  const v=$('#viewer');v.innerHTML='';
  if(S.io)S.io.disconnect();
  S.io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){S.io.unobserve(en.target);const p=S.pages.find(x=>x.id===en.target.dataset.id);if(p)drawPage(p,en.target.querySelector('canvas'),S.zoom)}
  }),{root:v,rootMargin:'800px 0px'});
  S.pages.forEach(p=>{const el=buildPage(p);v.appendChild(el);S.io.observe(el)});
  renderFloat();updateCur();
}
async function drawPage(p,cv,scale){
  const dpr=Math.min(window.devicePixelRatio||1,2),d=dims(p);
  try{cv._t&&cv._t.cancel()}catch(_){}
  cv.style.width=d.w*scale+'px';cv.style.height=d.h*scale+'px';
  if(p.doc<0){cv.width=Math.round(d.w*scale*dpr);cv.height=Math.round(d.h*scale*dpr);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);return}
  const pg=S.docs[p.doc].pg[p.n];
  const vp=pg.getViewport({scale:scale*dpr,rotation:(pg.rotate+p.rot)%360});
  cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
  const t=pg.render({canvasContext:cv.getContext('2d'),viewport:vp});cv._t=t;
  try{await t.promise}catch(err){if(!err||err.name!=='RenderingCancelledException')console.error(err)}
}
function buildPage(p){
  const d=dims(p),z=S.zoom;
  const el=document.createElement('div');el.className='page';el.dataset.id=p.id;
  el.style.width=d.w*z+'px';el.style.height=d.h*z+'px';
  const cv=document.createElement('canvas');
  const layer=document.createElement('div');layer.className='layer';
  el.append(cv,layer);
  layer.addEventListener('pointerdown',e=>layerDown(e,S.pages.find(x=>x.id===el.dataset.id),layer));
  layer.addEventListener('pointermove',e=>{if(S.tool==='text'&&!e.buttons)hover(S.pages.find(x=>x.id===el.dataset.id),layer,e)});
  layer.addEventListener('pointerleave',()=>{if(layer._hov)layer._hov.style.display='none'});
  layer.addEventListener('dblclick',e=>{
    const t=e.target.closest('.an.text');if(!t)return;
    const pp=S.pages.find(x=>x.id===el.dataset.id);const a=pp.annots.find(x=>x.id===t.dataset.id);
    if(a){push();S.sel={id:a.id};redrawLayers();startEdit(a,pp,layer);renderProps()}
  });
  renderLayer(layer,p);
  return el;
}
const hexA=(h,o)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${o})`};
function styleText(el,a,z){el.style.fontSize=a.size*z+'px';el.style.color=a.color;el.style.fontFamily=FAM[a.font||'sans'];el.style.fontWeight=a.bold?'700':'400';el.style.fontStyle=a.italic?'italic':'normal'}
function renderLayer(layer,p){
  layer.innerHTML='';const z=S.zoom,d=dims(p);
  p.annots.forEach(a=>layer.appendChild(mkAnnot(a,z,d)));
  if(layer.isConnected)p.annots.forEach(a=>{if(a.type==='text'){const el=layer.querySelector(`[data-id="${a.id}"]`);if(el&&!el.classList.contains('edit')){a.w=el.offsetWidth/z;a.h=el.offsetHeight/z}}});
}
function mkAnnot(a,z,d){
  const sel=S.sel&&S.sel.id===a.id;let el;
  if(a.type==='pen'){
    el=document.createElementNS(NS,'svg');el.setAttribute('class','an pen');el.setAttribute('width',d.w*z);el.setAttribute('height',d.h*z);el.dataset.id=a.id;
    const dd=a.points.map((q,i)=>(i?'L':'M')+q[0]*z+' '+q[1]*z).join(' ')+(a.points.length===1?' l0.01 0':'');
    if(sel){const h=document.createElementNS(NS,'path');h.setAttribute('d',dd);h.setAttribute('stroke','#4f7cff');h.setAttribute('stroke-opacity','.3');h.setAttribute('stroke-width',a.width*z+8);el.appendChild(h)}
    const pth=document.createElementNS(NS,'path');pth.setAttribute('d',dd);pth.setAttribute('stroke',a.color);pth.setAttribute('stroke-width',Math.max(a.width*z,1));
    const hit=pth.cloneNode();hit.setAttribute('stroke-opacity','0');hit.setAttribute('stroke-width',Math.max(a.width*z,14));
    el.append(pth,hit);
    return el;
  }
  el=document.createElement('div');el.dataset.id=a.id;el.className='an '+a.type+(sel?' sel':'');
  el.style.left=a.x*z+'px';el.style.top=a.y*z+'px';
  if(a.type==='text'){el.textContent=a.text;styleText(el,a,z)}
  else{
    el.style.width=a.w*z+'px';el.style.height=a.h*z+'px';
    if(a.type==='image'){const im=document.createElement('img');im.src=S.assets[a.img];el.appendChild(im)}
    else{
      el.style.boxSizing='border-box';
      el.style.background=a.fill?hexA(a.fill,a.fillOp):'transparent';
      el.style.border=a.stroke?`${a.sw*z}px solid ${a.stroke}`:'none';
      if(a.mode==='hl')el.style.mixBlendMode='multiply';
    }
    if(sel){const h=document.createElement('div');h.className='rh';el.appendChild(h)}
  }
  return el;
}
function redrawPage(p){const el=pgEl(p.id);if(el)renderLayer($('.layer',el),p)}
function redrawLayers(){S.pages.forEach(redrawPage);renderFloat()}
const findSel=()=>{if(!S.sel)return null;for(const p of S.pages){const a=p.annots.find(x=>x.id===S.sel.id);if(a)return{a,p}}return null};
function bboxOf(a){
  if(a.type==='pen'){const xs=a.points.map(q=>q[0]),ys=a.points.map(q=>q[1]);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}
  if(a.type==='text')return{x:a.x,y:a.y,w:a.w||(a.text||'').length*a.size*.55||20,h:a.h||a.size*1.25};
  return{x:a.x,y:a.y,w:a.w,h:a.h};
}

/* ---------- floating toolbar ---------- */
function renderFloat(){
  $$('.ftb').forEach(x=>x.remove());
  const s=findSel();if(!s)return;const el=pgEl(s.p.id);if(!el)return;
  const a=s.a,z=S.zoom,bb=bboxOf(a);
  const f=document.createElement('div');f.className='ftb';
  const b=(k,t,inner,cls='')=>`<button class="fb ${cls}" data-f="${k}" title="${t}">${inner}</button>`;
  let h=b('move','Drag to move',ic('move',16),'mv');
  if(a.type==='text')h+=b('b','Bold','<b>B</b>',a.bold?'on':'')+b('i','Italic','<i style="font-family:serif">I</i>',a.italic?'on':'')+b('sm','Smaller','A−')+`<span class="fsz">${Math.round(a.size)}</span>`+b('lg','Larger','A+')+b('col','Color',`<span class="dot" style="background:${a.color}"></span>`);
  h+=b('dup','Duplicate',ic('copy',16))+b('del','Delete',ic('trash',16),'dn');
  h+='<div class="pal hidden">'+PAL.map(c=>`<span class="pc" data-c="${c}" style="background:${c}"></span>`).join('')+'</div>';
  f.innerHTML=h;
  el.appendChild(f);
  let top=bb.y*z-46;if(top<4)top=(bb.y+bb.h)*z+10;
  f.style.top=top+'px';f.style.left=clamp(bb.x*z-4,0,Math.max(0,el.offsetWidth-f.offsetWidth))+'px';
  f.addEventListener('mousedown',e=>e.preventDefault());
  f.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    if(e.target.closest('[data-f="move"]')){
      e.preventDefault();const ed=$('.an.edit');if(ed)ed.blur();
      const s2=findSel();if(!s2)return;const layer=$('.layer',pgEl(s2.p.id));startMove(e,s2.a,s2.p,layer,ptOf(e,layer));
    }
  });
  f.addEventListener('click',e=>{
    const pc=e.target.closest('.pc');
    if(pc){applyToSel(a=>a.color=pc.dataset.c);S.props.tcolor=pc.dataset.c;renderFloat();return}
    const bt=e.target.closest('[data-f]');if(!bt)return;const k=bt.dataset.f;
    if(k==='b')applyToSel(a=>a.bold=!a.bold);
    else if(k==='i')applyToSel(a=>a.italic=!a.italic);
    else if(k==='sm'||k==='lg')applyToSel(a=>{const st=a.size>=24?2:1;a.size=clamp(Math.round((a.size+(k==='lg'?st:-st))*10)/10,6,200)});
    else if(k==='col'){$('.pal',f).classList.toggle('hidden');return}
    else if(k==='dup')return dupSel();
    else if(k==='del')return delSel();
    else return;
    renderFloat();
  });
}
function applyToSel(fn){
  const s=findSel();if(!s)return;burst();fn(s.a);s.a._t=1;
  const ed=$('.an.edit');
  if(ed&&ed.dataset.id===s.a.id)styleText(ed,s.a,S.zoom);else{redrawLayers();renderProps()}
}
function dupSel(){const s=findSel();if(!s)return;push();const c=JSON.parse(JSON.stringify(s.a));c.id=nid();delete c.link;if(c.points)c.points=c.points.map(q=>[q[0]+14,q[1]+14]);else{c.x+=14;c.y+=14}s.p.annots.push(c);S.sel={id:c.id};redrawLayers();renderProps()}

/* ---------- existing text runs ---------- */
const keyOf=p=>p.id+'|'+p.rot;
function runsSync(p){const k=keyOf(p);if(S.runs[k])return S.runs[k];getRuns(p);return null}
function getRuns(p){
  const key=keyOf(p);
  if(S.runs[key])return Promise.resolve(S.runs[key]);
  if(S.loading[key])return S.loading[key];
  if(p.doc<0)return Promise.resolve(S.runs[key]=[]);
  return S.loading[key]=(async()=>{
    const D=S.docs[p.doc],pg=D.pg[p.n];
    if(!D.tc[p.n]){try{D.tc[p.n]=await pg.getTextContent()}catch(_){D.tc[p.n]={items:[],styles:{}}}}
    const tc=D.tc[p.n],vp=pg.getViewport({scale:1,rotation:(pg.rotate+p.rot)%360}),cache={};
    const fi=name=>{
      if(cache[name])return cache[name];
      let nm='';try{if(pg.commonObjs.has(name))nm=pg.commonObjs.get(name).name||''}catch(_){}
      const ff=((tc.styles[name]||{}).fontFamily||'').toLowerCase(),n=nm.toLowerCase();
      const font=/mono|courier/.test(ff+n)?'mono':((/serif/.test(ff)&&!/sans/.test(ff))||/times|georgia|garamond|minion|palatino/.test(n))?'serif':'sans';
      const r={font,bold:/bold|black|heavy|demi/.test(n),italic:/italic|oblique/.test(n)};
      if(nm)cache[name]=r;return r;
    };
    const runs=[];let cur=null;
    for(const it of tc.items){
      if(typeof it.str!=='string'||!it.str.length)continue;
      const m=pdfjsLib.Util.transform(vp.transform,it.transform);
      if(Math.abs(m[1])>.01||Math.abs(m[2])>.01||m[0]<=0)continue;
      const fs=Math.abs(m[3]);if(fs<2)continue;
      const x=m[4],base=m[5],w=it.width,f=fi(it.fontName);
      if(cur&&cur.fn===it.fontName&&Math.abs(cur.fs-fs)<.6&&Math.abs(cur.base-base)<.9&&x-(cur.x+cur.w)>-fs*.3&&x-(cur.x+cur.w)<fs*.55){
        const gap=x-(cur.x+cur.w);
        if(gap>fs*.15&&!/\s$/.test(cur.str)&&!/^\s/.test(it.str))cur.str+=' ';
        cur.str+=it.str;cur.w=x+w-cur.x;
      }else{cur={str:it.str,x,base,w,fs,fn:it.fontName,font:f.font,bold:f.bold,italic:f.italic};runs.push(cur)}
    }
    S.runs[key]=runs.filter(r=>r.str.trim().length&&r.w>1);
    delete S.loading[key];
    return S.runs[key];
  })();
}
const hitRun=(r,pt)=>pt.x>=r.x-1&&pt.x<=r.x+r.w+1&&pt.y>=r.base-r.fs*.95&&pt.y<=r.base+r.fs*.25;
function hover(p,layer,e){
  if(!p)return;const rs=runsSync(p);if(!rs)return;
  const pt=ptOf(e,layer),r=!e.target.closest('.an')&&rs.find(r=>hitRun(r,pt));let h=layer._hov;
  if(!r){if(h)h.style.display='none';return}
  if(!h||!h.isConnected){h=layer._hov=document.createElement('div');h.className='hov';layer.appendChild(h)}
  const z=S.zoom;h.style.display='block';h.style.left=(r.x-2)*z+'px';h.style.top=(r.base-r.fs*.95-1)*z+'px';h.style.width=(r.w+4)*z+'px';h.style.height=(r.fs*1.2+2)*z+'px';
}
function sampleColors(p,r){
  const out={bg:'#ffffff',fg:'#111111'};
  try{
    const el=pgEl(p.id),cv=el&&$('canvas',el);if(!cv||cv.width<10)return out;
    const k=cv.width/dims(p).w;
    let x0=Math.floor(r.x*k),y0=Math.floor((r.base-r.fs*.95)*k),w=Math.ceil(r.w*k),h=Math.ceil(r.fs*1.2*k);
    x0=clamp(x0,0,cv.width-1);y0=clamp(y0,0,cv.height-1);w=clamp(w,1,cv.width-x0);h=clamp(h,1,cv.height-y0);
    const d=cv.getContext('2d').getImageData(x0,y0,w,h).data,step=Math.max(1,Math.floor(d.length/4/6000));
    const bins={};let best=null,bc=0;
    for(let i=0;i<d.length;i+=4*step){const key=(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3);const b=bins[key]||(bins[key]={n:0,r:0,g:0,b:0});b.n++;b.r+=d[i];b.g+=d[i+1];b.b+=d[i+2];if(b.n>bc){bc=b.n;best=b}}
    if(!best)return out;
    const br=best.r/best.n,bg=best.g/best.n,bb=best.b/best.n;
    let far=0,fr=0,fg=0,fb=0;
    for(let i=0;i<d.length;i+=4*step){const dd=(d[i]-br)**2+(d[i+1]-bg)**2+(d[i+2]-bb)**2;if(dd>far){far=dd;fr=d[i];fg=d[i+1];fb=d[i+2]}}
    const hx=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
    out.bg=hx(br,bg,bb);
    if(far<1200){const lum=.3*br+.59*bg+.11*bb;out.fg=lum>140?'#111111':'#ffffff'}else out.fg=hx(fr,fg,fb);
  }catch(_){}
  return out;
}
function editRun(p,r,layer){
  push();const c=sampleColors(p,r);
  const rect={id:nid(),type:'rect',mode:'wo',x:r.x-1.5,y:r.base-r.fs*.95,w:r.w+3,h:r.fs*1.2,sw:0,fill:c.bg,fillOp:1,stroke:null};
  const a={id:nid(),type:'text',x:r.x,y:r.base-r.fs*.97,text:r.str,orig:r.str,size:Math.round(r.fs*10)/10,color:c.fg,font:r.font,bold:r.bold,italic:r.italic,link:rect.id};
  p.annots.push(rect,a);S.sel={id:a.id};redrawLayers();renderProps();
  setTimeout(()=>startEdit(a,p,layer),0);
}

/* ---------- thumbnails ---------- */
function renderThumbs(){
  const s=$('#thumbs');s.innerHTML='';
  if(S.tio)S.tio.disconnect();
  S.tio=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){S.tio.unobserve(en.target);const p=S.pages[+en.target.dataset.i];if(p){const cv=$('canvas',en.target);drawPage(p,cv,cv._sc)}}
  }),{root:$('#side'),rootMargin:'400px 0px'});
  S.pages.forEach((p,i)=>{

function fileToAsset(file,M=1800){

    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,M/Math.max(im.naturalWidth||300,im.naturalHeight||300));
      const w=Math.max(1,Math.round((im.naturalWidth||300)*k)),h=Math.max(1,Math.round((im.naturalHeight||300)*k));
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
      const jpg=/jpe?g/i.test(file.type);if(jpg){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
      x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
      res({url:c.toDataURL(jpg?'image/jpeg':'image/png',.92),w,h});
    };
    im.onerror=()=>rej(new Error('Could not read that image'));im.src=url;
  });
}

const pad=$('#sigPad'),pc=pad.getContext('2d');let sigMode='draw',sigInk='#111111',drawing=false,last;

$('#sigCancel').onclick=()=>$('#sigModal').classList.add('hidden');
$('#sigOk').onclick=()=>{
  const im=pc.getImageData(0,0,pad.width,pad.height).data;let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<pad.height;y++)for(let x=0;x<pad.width;x++)if(im[(y*pad.width+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return toast('Please draw or type your signature first');
  const m=6;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(pad.width-1,x1+m);y1=Math.min(pad.height-1,y1+m);
  const w=x1-x0+1,h=y1-y0+1,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(pad,x0,y0,w,h,0,0,w,h);
  $('#sigModal').classList.add('hidden');placeImage(c.toDataURL('image/png'),w,h);
};

/* ---------- export ---------- */
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)};
function textPng(a){
  const s=a.size,k=4,lines=a.text.replace(/\t/g,'    ').split('\n'),font=`${a.italic?'italic ':''}${a.bold?'bold ':''}${s*k}px ${FAM[a.font||'sans']}`;
  const c=document.createElement('canvas'),x=c.getContext('2d');x.font=font;
  const w=Math.ceil(Math.max(...lines.map(l=>x.measureText(l).width)))+2,lh=s*1.25*k;
  c.width=w;c.height=Math.ceil(lh*lines.length);x.font=font;x.fillStyle=a.color;x.textBaseline='alphabetic';
  lines.forEach((l,i)=>x.fillText(l,0,i*lh+s*k*.97));
  return{url:c.toDataURL('image/png'),w:w/k,h:c.height/k};
}
async function buildPdf(idxs){
  const{PDFDocument,degrees,LineCapStyle,StandardFonts}=PDFLib;
  const out=await PDFDocument.create(),src={},fonts={},imgs={};
  const dataBytes=async u=>new Uint8Array(await (await fetch(u)).arrayBuffer());
  for(const idx of idxs){
    const p=S.pages[idx];let page;
    if(p.doc<0)page=out.addPage([p.w,p.h]);
    else{
      if(!src[p.doc])src[p.doc]=await PDFDocument.load(S.docs[p.doc].bytes,{ignoreEncryption:true});
      const[cp]=await out.copyPages(src[p.doc],[p.n-1]);page=out.addPage(cp);
    }
    const R=(page.getRotation().angle+p.rot)%360;page.setRotation(degrees(R));
    const{width:W,height:H}=page.getSize(),mb=page.getMediaBox(),mx=mb.x||0,my=mb.y||0;
    const M=(dx,dy)=>{let X,Y;if(R===0){X=dx;Y=H-dy}else if(R===90){X=dy;Y=dx}else if(R===180){X=W-dx;Y=dy}else{X=W-dy;Y=H-dx}return{x:X+mx,y:Y+my}};
    const rot=degrees(R);
    for(const a of p.annots){
      if(a.type==='pen'){
        const pts=a.points.map(q=>M(q[0],q[1])),col=hexRgb(a.color);
        if(pts.length===1)pts.push({x:pts[0].x+.01,y:pts[0].y});
        for(let i=1;i<pts.length;i++)page.drawLine({start:pts[i-1],end:pts[i],thickness:a.width,color:col,lineCap:LineCapStyle.Round});
      }
      else if(a.type==='rect'){
        const o=M(a.x,a.y+a.h);
        page.drawRectangle({x:o.x,y:o.y,width:a.w,height:a.h,rotate:rot,color:a.fill?hexRgb(a.fill):undefined,opacity:a.fill?a.fillOp:0,borderColor:a.stroke&&a.sw?hexRgb(a.stroke):undefined,borderWidth:a.stroke&&a.sw?a.sw:0,borderOpacity:1});
      }
      else if(a.type==='image'){
        const u=S.assets[a.img];if(!imgs[a.img]){const b=await dataBytes(u);imgs[a.img]=u.startsWith('data:image/png')?await out.embedPng(b):await out.embedJpg(b)}
        const o=M(a.x,a.y+a.h);page.drawImage(imgs[a.img],{x:o.x,y:o.y,width:a.w,height:a.h,rotate:rot});
      }
      else if(a.type==='text'){
        if(!a.text.trim())continue;
        const latin=!/[^\x20-\x7e\xa0-\xff\n\t]/.test(a.text);
        if(latin){
          const key=FM[a.font||'sans'][(a.bold?1:0)+(a.italic?2:0)];if(!fonts[key])fonts[key]=await out.embedFont(StandardFonts[key]);
          a.text.replace(/\t/g,'    ').split('\n').forEach((ln,i)=>{
            if(!ln)return;const o=M(a.x,a.y+a.size*.97+i*a.size*1.25);
            page.drawText(ln,{x:o.x,y:o.y,size:a.size,font:fonts[key],color:hexRgb(a.color),rotate:rot});
          });
        }else{
          const t=textPng(a),img=await out.embedPng(await dataBytes(t.url)),o=M(a.x,a.y+t.h);
          page.drawImage(img,{x:o.x,y:o.y,width:t.w,height:t.h,rotate:rot});
        }
      }
    }
  }
  return out.save();
}
async function download(idxs,suffix){
  if(typeof PDFLib==='undefined')return toast('Libraries failed to load. Check your internet connection.');
  toast('Preparing your PDF…',true);
  try{
    const bytes=await buildPdf(idxs||S.pages.map((_,i)=>i));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    a.download=S.name+(suffix||'-edited')+'.pdf';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Downloaded ✓');
  }catch(err){console.error(err);toast('Could not export: '+(err.message||err))}
}

/* ---------- wiring ---------- */
$('#btnOpen').onclick=$('#emOpen').onclick=()=>$('#file').click();
$('#emBlank').onclick=addBlankFirst;
$('#btnDl').onclick=()=>download();
$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;
$('#btnSide').onclick=()=>$('#side').classList.toggle('open');
$('#zIn').onclick=()=>setZoom(S.zoom*1.15);$('#zOut').onclick=()=>setZoom(S.zoom/1.15);$('#zFit').onclick=()=>fitZoom();
$('#file').onchange=e=>{const f=e.target.files;if(f.length)openFiles(f,false);e.target.value=''};
$('#mergeFile').onchange=e=>{const f=e.target.files;if(f.length){if(!S.pages.length)openFiles(f,false);else openFiles(f,true)}e.target.value=''};
addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();document.body.classList.add('dragging')}});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragging')});
addEventListener('drop',e=>{
  document.body.classList.remove('dragging');
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();openFiles(e.dataTransfer.files,false)}
});
addEventListener('keydown',e=>{
  const editing=e.target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName),mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'&&!editing){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&e.key.toLowerCase()==='y'&&!editing){e.preventDefault();redo()}
  else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();if(S.pages.length)download()}
  else if(!editing&&S.sel&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();delSel()}
  else if(e.key==='Escape'){hidePop();if(editing&&e.target.blur)e.target.blur();else if(S.sel){S.sel=null;redrawLayers();renderProps()}}
});
addEventListener('beforeunload',e=>{if(S.undo.length){e.preventDefault();e.returnValue=''}});
addEventListener('resize',updateCur);

setToolUi();refreshUi();renderProps();
if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
else toast('Could not load PDF libraries. Please check your internet connection.');
})();
</script>
